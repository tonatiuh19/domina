openapi: 3.0.3
info:
  title: DOMINA API
  version: 0.1.0
  description: Single Vercel serverless monolith. Learners and staff use separate session tables. Company buyers are staff with role=company.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
  /catalog/courses:
    get:
      summary: Published courses with upcoming editions
  /catalog/courses/{slug}:
    get:
      summary: One published course
  /auth/user/request-otp:
    post:
      summary: Email a learner login code. Live mail is skipped under VITEST and for @example.test.
  /auth/user/verify-otp:
    post:
      summary: Create a user session
  /auth/user/logout:
    post:
      summary: Revoke the user session
  /auth/user/me:
    get:
      summary: Current learner
    patch:
      summary: Update learner profile including optional preferred language
  /auth/user/language:
    put:
      summary: Persist learner UI language preference (es|en)
  /auth/admin/check:
    post:
      summary: Whether a staff or company email already exists
  /auth/admin/request-otp:
    post:
      summary: Email a portal login code. Optional companyName registers a company role account.
  /auth/admin/verify-otp:
    post:
      summary: Create a staff session
  /auth/admin/me:
    get:
      summary: Current staff member including company role fields
  /auth/admin/language:
    put:
      summary: Persist staff UI language preference (es|en)
  /auth/admin/logout:
    post:
      summary: Revoke the staff session
  /portal/enrollments:
    get:
      summary: Learner seats
    post:
      summary: Reserve a seat
  /portal/enrollments/{id}:
    get:
      summary: Single learner seat by id (refresh-safe pay page)
  /portal/checkout:
    post:
      summary: Stripe Checkout elements client secret with card + OXXO; return_url lands on /cuenta/pagar/:id. After an OXXO voucher, mints a fresh open session so payment methods stay available (prior OXXO payment row kept as processing).
  /portal/checkout/confirm:
    post:
      summary: Mark a seat paid (or pending_oxxo) after Stripe returns to the pay page; pending_oxxo also emails the branded voucher
  /portal/checkout/oxxo-email:
    post:
      summary: Email (or resend) the branded OXXO voucher with hosted barcode link for a pending seat
  /portal/checkout/oxxo-voucher:
    post:
      summary: Load OXXO voucher details (URL, reference, expiry) for the branded in-app voucher modal
  /portal/checkout/transfer:
    post:
      summary: Start a non-Stripe SPEI transfer hold with DOMINA-{enrollmentId} concept
  /portal/checkout/coupon:
    post:
      summary: Apply a DOMINA-owned coupon on the pay page; updates enrollment.amount_cents for card/OXXO/SPEI
    delete:
      summary: Remove an applied coupon before pay and restore list price
  /portal/checkout/confirm-free:
    post:
      summary: Confirm a $0 seat after a coupon brings the total to zero (no Stripe/SPEI)
  /admin/coupons:
    get:
      summary: List coupons (owner + finance)
    post:
      summary: Create a coupon code (owner + finance)
  /admin/coupons/{id}:
    get:
      summary: Load one coupon with scope ids and redemption count
    patch:
      summary: Update coupon fields, scope, or active flag
  /site/pages/{slug}:
    get:
      summary: Public legal page markdown (terminos, privacidad) localized by lang query
  /admin/pages:
    get:
      summary: List legal pages for owners and coordinators
  /admin/pages/{slug}:
    get:
      summary: Load bilingual markdown legal page for editing
    patch:
      summary: Save bilingual markdown legal page
  /portal/feedback:
    post:
      summary: Rate a completed seat
  /admin/company/requests:
    get:
      summary: Company role — own training requests
    post:
      summary: Company role — ask for a private edition
  /admin/dashboard:
    get:
      summary: Occupancy, revenue, and open requests (ops roles)
  /admin/courses:
    get:
      summary: Paginated courses grid (search, sort, page, limit)
    post:
      summary: Create a course with full content fields; then upload cover/gallery via CDN endpoints
  /admin/courses/slug-availability:
    get:
      summary: Check whether a course slug is free and return a unique suggestion
  /admin/catalog/{kind}:
    get:
      summary: List catalog options (categories|levels|audiences|cities|venues); includeInactive=1 shows deactivated
    post:
      summary: Create a catalog option (owner/coordinator)
  /admin/catalog/{kind}/{id}:
    patch:
      summary: Update or soft-deactivate a catalog option
  /admin/courses/{id}:
    get:
      summary: Course, editions, and edition-scoped participants
    patch:
      summary: Update course operations fields
  /admin/courses/{id}/cover-image:
    post:
      summary: Upload a course cover image to Disrupting Labs CDN
  /admin/courses/{id}/gallery:
    post:
      summary: Add a gallery image for a course
  /admin/courses/{id}/gallery/{imageId}:
    patch:
      summary: Update a gallery image caption
    delete:
      summary: Remove a gallery image
  /admin/courses/{id}/editions:
    post:
      summary: Schedule an edition
  /admin/editions:
    get:
      summary: Open editions for manual enrollment (presale/confirmed)
  /admin/editions/{id}:
    patch:
      summary: Update an edition
  /admin/enrollments/{id}:
    patch:
      summary: Attendance or offline payment method
  /admin/participants:
    get:
      summary: Paginated participants across courses (search, sort, filters)
    post:
      summary: Manually enroll a learner (create user if needed) and mark paid
  /admin/payments:
    get:
      summary: Paginated payment ledger
  /admin/transfers:
    get:
      summary: SPEI transfer queue (processing/succeeded/failed)
  /admin/transfers/{id}/confirm:
    post:
      summary: Confirm a pending bank transfer and mark the seat paid
  /admin/transfers/{id}/reject:
    post:
      summary: Reject a pending transfer; enrollment stays pending for another method
  /admin/bank-transfer-settings:
    get:
      summary: Bank account details shown for SPEI checkout
    patch:
      summary: Update bank transfer settings (owner/finance/coordinator)
  /admin/team:
    get:
      summary: Paginated staff roster (excludes instructors; use Instructores)
    post:
      summary: Invite staff or a company contact (not instructors)
  /admin/team/{id}:
    patch:
      summary: Change staff role or status
  /admin/instructors:
    get:
      summary: Search/list instructors (owner/coordinator); supports q + activeOnly
    post:
      summary: Invite an instructor with welcome email (owner/coordinator)
  /admin/instructors/{id}:
    patch:
      summary: Update instructor status or name
  /instructor/editions:
    get:
      summary: Editions assigned to the signed-in instructor
  /instructor/editions/{id}/participants:
    get:
      summary: Paid roster for an instructor-owned edition
  /admin/notifications:
    get:
      summary: In-app notification inbox for the signed-in staff member
  /admin/notifications/{id}/read:
    post:
      summary: Mark one notification read
  /admin/notifications/read-all:
    post:
      summary: Mark all notifications read
  /admin/requests:
    get:
      summary: All company requests for ops
